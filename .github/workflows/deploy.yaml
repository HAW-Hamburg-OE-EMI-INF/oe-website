name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: "Enable maintenance mode for this build"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting (oxfmt)
        run: npm run fmt:check

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Build both sites
        env:
          PUBLIC_MAINTENANCE_MODE: ${{ inputs.maintenance_mode || vars.MAINTENANCE_MODE || 'false' }}
        run: npm run build

      - name: Upload EMI build artifact
        uses: actions/upload-artifact@v7
        with:
          name: emi-dist
          path: ./emi/dist
          retention-days: 1

      - name: Upload INF build artifact
        uses: actions/upload-artifact@v7
        with:
          name: inf-dist
          path: ./inf/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: EMI
            artifact: emi-dist
            secret_name: DEPLOY_KEY_EMI
            repo: HAW-Hamburg-OE-EMI-INF/oe-emi-pages
            # cname: oe-emi.de
            cname: emi.oe.dashline.de
          - site: INF
            artifact: inf-dist
            secret_name: DEPLOY_KEY_INF
            repo: HAW-Hamburg-OE-EMI-INF/oe-inf-pages
            # cname: oe.informatik.haw-hamburg.de
            cname: inf.oe.dashline.de
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download ${{ matrix.site }} build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ./dist

      - name: Deploy ${{ matrix.site }} to Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets[matrix.secret_name] }}
          external_repository: ${{ matrix.repo }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: ${{ matrix.cname }}
