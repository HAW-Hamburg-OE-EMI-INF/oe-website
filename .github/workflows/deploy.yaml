name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm clean-install

      - name: Check formatting (oxfmt)
        run: npm run fmt:check

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Build both sites
        run: npm run build

      - name: Deploy EMI to Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY_EMI }}
          external_repository: HAW-Hamburg-OE-EMI-INF/oe-emi-pages
          publish_branch: gh-pages
          publish_dir: ./emi/dist
          # cname: oe-emi.de
          cname: emi.oe.dashline.de

      - name: Deploy INF to Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY_INF }}
          external_repository: HAW-Hamburg-OE-EMI-INF/oe-inf-pages
          publish_branch: gh-pages
          publish_dir: ./inf/dist
          # cname: oe.informatik.haw-hamburg.de
          cname: inf.oe.dashline.de
